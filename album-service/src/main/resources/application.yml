server:
  port: 8081

spring:
  application:
    name: album-service
  datasource:
    url: jdbc:h2:mem:albumdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

recommendation:
  service:
    url: http://localhost:8082

logging:
  level:
    org.cloudfoundry.samples.albumservice: INFO
