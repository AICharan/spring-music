plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.cloudfoundry.samples'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Java CfEnv (Spring Boot 3 compatible)
    implementation 'io.pivotal.cfenv:java-cfenv-boot:3.1.0'

    // JPA Persistence
    runtimeOnly 'org.apache.commons:commons-pool2'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'

    // Webjars (legacy UI — kept for compatibility)
    implementation 'org.webjars:bootstrap:3.1.1'
    implementation 'org.webjars:angularjs:1.2.16'
    implementation 'org.webjars:angular-ui:0.4.0-2'
    implementation 'org.webjars:angular-ui-bootstrap:0.10.0-1'
    implementation 'org.webjars:jquery:2.1.0-2'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

jar {
    archiveBaseName = 'spring-music'
}

test {
    useJUnitPlatform()
}
